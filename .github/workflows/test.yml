name: Test Suite

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".devin/**"
      - ".claude/**"
      - ".agents/**"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".devin/**"
      - ".claude/**"
      - ".agents/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Playwright base URL (leave empty for local build)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Unit & Integration Tests ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # runners cache an older 22.x (22.23.3) that Astro 7 (>=22.23.4) rejects
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test-key' }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || 'test-secret' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'test-public' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || 'test-private' }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL || 'mailto:test@example.com' }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL || 'https://test.upstash.io' }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN || 'test-token' }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET || 'test-secret' }}

      - name: Build site
        run: npm run build
        env:
          PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'test-public' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY || 'test-site' }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID || 'G-TEST123' }}

      - name: Audit the build (SEO gates)
        run: npm run audit:build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── End-to-End Tests (Local Build) ──────────────────────────────────────────
  e2e-tests-local:
    name: E2E Tests (Local Build)
    runs-on: ubuntu-latest
    needs: unit-tests
    # PR and manual runs only — pushes to main already proved this suite on the
    # PR, and the production smoke job covers the deployed site.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # runners cache an older 22.x (22.23.3) that Astro 7 (>=22.23.4) rejects
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Store Playwright's version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # No explicit build: test:serve rebuilds inside Playwright's webServer,
      # and the build audit runs in the unit job.
      - name: Run E2E tests
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile
        env:
          PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'test-public' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY || 'test-site' }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID || 'G-TEST123' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 7

  # ── End-to-End Tests (Deployed Preview) ───────────────────────────────────
  e2e-tests-preview:
    name: E2E Tests (Vercel Preview)
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      deployments: read
    # Only run on PRs or when base_url is explicitly provided
    if: github.event_name == 'pull_request' || inputs.base_url != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # runners cache an older 22.x (22.23.3) that Astro 7 (>=22.23.4) rejects
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Store Playwright's version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Determine preview URL
        id: preview
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$INPUT_BASE_URL" ]; then
            echo "url=$INPUT_BASE_URL" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Each PR gets its own preview deployment; read its real URL off the
          # GitHub Deployment Vercel reports. The old fallback hit production,
          # so PRs were testing the live site instead of their own deploy.
          for i in $(seq 1 60); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA&environment=Preview" --jq '.[0].id' 2>/dev/null || true)
            if [ -n "$DEPLOY_ID" ]; then
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" --jq '.[0].environment_url // empty' 2>/dev/null || true)
              if [ -n "$URL" ]; then
                echo "url=$URL" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for the Vercel preview deployment"
          exit 1

      - name: Run E2E tests against preview
        run: npx playwright test --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7

  # ── End-to-End Tests (Production Smoke) ─────────────────────────────────────
  e2e-tests-production:
    name: E2E Smoke Tests (Production)
    runs-on: ubuntu-latest
    # Run only on main branch pushes, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # runners cache an older 22.x (22.23.3) that Astro 7 (>=22.23.4) rejects
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Store Playwright's version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: npx playwright test tests/e2e/broken-links.spec.ts tests/e2e/navigation.spec.ts --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: https://btxclinicalresearch.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7
